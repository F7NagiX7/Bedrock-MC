<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cantera Bedrock</title>
<meta name="description" content="Addons, resource packs, shaders, mundos y holoprints para Minecraft Bedrock.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Pixelify+Sans:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Cantera Bedrock<small>Addons, packs, shaders, mundos y holoprints</small></div>
    <input id="q" class="search" type="search" placeholder="Buscar por nombre, autor o etiqueta" aria-label="Buscar">
    <button id="btnNew" class="btn primary" type="button" hidden>Publicar</button>
    <button id="btnAuth" class="btn" type="button">Admin</button>
  </header>
  <nav id="tabs" class="tabs" role="tablist" aria-label="Categorías"></nav>
  <div class="filters">
    <label>Versión <select id="fVer"><option value="">Todas</option></select></label>
    <label>Orden <select id="fSort">
      <option value="new">Más recientes</option><option value="old">Más antiguos</option>
      <option value="dl">Más descargados</option><option value="name">Nombre A-Z</option></select></label>
    <span id="count" class="count"></span>
  </div>
  <div id="status"></div>
  <main id="grid" class="grid" aria-live="polite"></main>
  <footer>Cantera Bedrock · Contenido de la comunidad para Minecraft Bedrock Edition. No afiliado a Mojang ni Microsoft.</footer>
</div>
<div id="layer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
